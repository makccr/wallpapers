name: Build & Deploy Gallery

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore thumbnail cache
        uses: actions/cache@v4
        with:
          path: .thumb-cache
          key: thumbs-${{ hashFiles('wallpapers/**') }}
          restore-keys: thumbs-

      - name: Install Pillow
        run: pip install Pillow --quiet

      - name: Generate thumbnails & site
        run: python3 .github/scripts/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
