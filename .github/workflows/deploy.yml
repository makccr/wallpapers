name: Build & Deploy Gallery

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore thumbnail cache
        uses: actions/cache@v4
        with:
          path: .thumb-cache
          key: thumbs-${{ hashFiles('wallpapers/**') }}
          restore-keys: thumbs-

      - name: Install Pillow
        run: pip install Pillow --quiet

      - name: Generate thumbnails & site
        run: python3 .github/scripts/build_site.py

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './_site'
          production-deploy: true
          deploy-message: "Deploy wallpaper gallery"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
